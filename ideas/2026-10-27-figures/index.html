<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Figures — 350,000 patent drawings as an infinite wall</title>
<style>
:root{
  --paper:#faf8f4;
  --tile:#ffffff;
  --ink:#111111;
  --line:#111111;
  --muted:#7a7468;
  --rule:#e3ded3;
  --accent:#c2410c;
  --shadow:0 1px 2px rgba(20,16,8,.06),0 8px 24px rgba(20,16,8,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131210;
    --tile:#1c1a17;
    --ink:#f3efe7;
    --line:#f0ece4;
    --muted:#9a9388;
    --rule:#2c2924;
    --accent:#ff8a4c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:16px;
  line-height:1.45;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--rule);
}
.bar{
  max-width:1360px;margin:0 auto;padding:10px 16px 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:4px}
.wordmark{
  font-size:19px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;
}
.tagline{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
@media(max-width:700px){.tagline{display:none}}

.searchwrap{position:relative;flex:1 1 320px;min-width:200px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
input[type=search]{
  width:100%;height:46px;padding:0 40px 0 38px;
  border:1px solid var(--rule);border-radius:2px;
  background:var(--tile);color:var(--ink);
  font-size:15px;font-family:inherit;
  appearance:none;-webkit-appearance:none;
}
input[type=search]::-webkit-search-cancel-button{display:none}
input[type=search]:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.clearx{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;background:none;color:var(--muted);
  font-size:20px;cursor:pointer;border-radius:50%;display:none;
}
.clearx.on{display:block}

select,.btn{
  height:46px;border:1px solid var(--rule);border-radius:2px;
  background:var(--tile);color:var(--ink);
  font-family:inherit;font-size:13.5px;letter-spacing:.04em;
  padding:0 14px;cursor:pointer;min-width:112px;
}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 21px,calc(100% - 11px) 21px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.btn{text-transform:uppercase;font-weight:600;white-space:nowrap}
.btn:hover,select:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.statusrow{
  max-width:1360px;margin:0 auto;padding:14px 16px 2px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.demo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--rule);padding:3px 8px;border-radius:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{
  font-size:11.5px;letter-spacing:.06em;border:1px solid var(--rule);
  background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- grid ---------- */
main{max-width:1360px;margin:0 auto;padding:16px 16px 72px}
.grid{
  column-count:4;column-gap:18px;
}
@media(max-width:1100px){.grid{column-count:3}}
@media(max-width:760px){.grid{column-count:2;column-gap:12px}}
@media(max-width:420px){.grid{column-count:1}}
.card{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  margin:0 0 18px;padding:0;width:100%;
  background:var(--tile);border:1px solid var(--rule);border-radius:2px;
  box-shadow:var(--shadow);
  cursor:pointer;text-align:left;color:inherit;font:inherit;
  display:block;
  animation:fadeUp .32s ease both;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
@media(max-width:760px){.card{margin-bottom:12px}}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,16,8,.1);border-color:var(--ink)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .art{padding:18px 16px 6px;display:block}
.card svg{display:block;width:100%;height:auto}
.meta{padding:10px 16px 16px;border-top:1px solid var(--rule);margin-top:12px}
.pno{font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.ptitle{font-size:14px;margin-top:3px;line-height:1.3}
.pclass{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.empty{
  text-align:center;padding:64px 20px;color:var(--muted);
}
.empty h2{font-size:17px;color:var(--ink);margin:14px 0 6px;font-weight:600}
.empty p{font-size:14px;margin:0 0 18px}

/* line art */
svg .ln{fill:none;stroke:var(--line);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg .th{stroke-width:1.2}
svg .lead{stroke:var(--line);stroke-width:1;fill:none}
svg .num{font-family:ui-monospace,Menlo,monospace;font-size:9px;fill:var(--line)}
svg .dot{fill:var(--line)}

/* ---------- detail panel ---------- */
.backdrop{
  position:fixed;inset:0;background:rgba(10,8,4,.55);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
  backdrop-filter:blur(2px);
}
.backdrop.on{opacity:1;pointer-events:auto}
.panel{
  position:fixed;z-index:70;background:var(--paper);
  top:0;right:0;height:100%;width:min(880px,100%);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-left:1px solid var(--rule);
}
.panel.on{transform:none}
@media(max-width:700px){
  .panel{top:auto;bottom:0;right:0;width:100%;height:92%;border-left:0;border-top:1px solid var(--rule);
    transform:translateY(102%);border-radius:10px 10px 0 0}
}
.phead{
  position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);
  padding:14px 18px;display:flex;align-items:flex-start;gap:12px;z-index:2;
}
.phead .grab{display:none}
@media(max-width:700px){
  .phead .grab{display:block;position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:2px;background:var(--rule)}
  .phead{padding-top:20px}
}
.pclose{
  margin-left:auto;width:44px;height:44px;flex:none;border:1px solid var(--rule);
  background:var(--tile);color:var(--ink);border-radius:50%;font-size:18px;cursor:pointer;line-height:1;
}
.pclose:hover{border-color:var(--ink)}
.pbody{padding:18px 18px 48px}
h1.dt{font-size:24px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.dsub{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.dplain{
  margin:16px 0 20px;font-size:16px;line-height:1.55;
  border-left:2px solid var(--accent);padding-left:14px;
}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.fig{background:var(--tile);border:1px solid var(--rule);border-radius:2px;padding:16px 14px 10px}
.fig svg{display:block;width:100%;height:auto}
.figcap{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:10px;text-transform:uppercase}
.facts{margin:22px 0 0;border-top:1px solid var(--rule)}
.fact{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.fact dt{flex:0 0 108px;color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px;margin:0}
.fact dd{margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.actions .btn{flex:1 1 180px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:var(--accent);color:#fff;padding:12px 20px;border-radius:2px;
  font-size:13.5px;letter-spacing:.06em;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);
  max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{
  border-top:1px solid var(--rule);padding:22px 16px 34px;text-align:center;
  font-size:11.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
}
.shuffling .card{animation:shuf .36s ease both}
@keyframes shuf{0%{opacity:0;transform:scale(.96) translateY(8px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <span class="wordmark">Figures</span>
      <span class="tagline">350,000 patent drawings as an infinite wall</span>
    </div>
    <div class="searchwrap">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
        placeholder="try: folding chair, camera grip, toaster, bicycle" aria-label="Search drawings">
      <button class="clearx" id="clearx" type="button" aria-label="Clear search">&times;</button>
    </div>
    <select id="decade" aria-label="Filter by decade"><option value="">All decades</option></select>
    <select id="klass" aria-label="Filter by class"><option value="">All classes</option></select>
    <button class="btn" id="shuffle" type="button">&#8646; Shuffle</button>
    <button class="btn dark" id="share" type="button">Share this wall</button>
  </div>
</header>

<div class="statusrow">
  <span class="count" id="count">14 of 14 figures</span>
  <span class="demo">Demo data</span>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><rect x="7" y="7" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M19 32l7-9 5 6 4-4 4 7z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    <h2>No figures match that</h2>
    <p id="emptymsg">Try a plainer word — the wall likes nouns.</p>
    <button class="btn" id="reset" type="button">Reset the wall</button>
  </div>
</main>

<footer>Prototype by Granted, inspired by your bookmarks</footer>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="dtitle" tabindex="-1">
  <div class="phead">
    <div class="grab"></div>
    <div>
      <div class="mono pno" id="dpno">—</div>
      <div class="dsub" id="dclass">—</div>
    </div>
    <button class="pclose" id="pclose" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- data: 14 fake-but-plausible design patents ---------- */
var DATA = [
 {no:"D-214,558",yr:1969,t:"Folding lawn chair",c:"Furniture",

var CLASSES=["Furniture","Tools","Kitchen","Transport","Electronics","Toys"];
var DECADES=["1930s","1940s","1950s","1960s","1980s","1990s","2000s","2010s"];
// build decades from data + spec range
var allDecades=["1930s","1940s","1950s","1960s","1970s","1980s","1990s","2000s","2010s"];

var grid=document.getElementById('grid'),
    qEl=document.getElementById('q'),
    decEl=document.getElementById('decade'),
    klEl=document.getElementById('klass'),
    countEl=document.getElementById('count'),
    emptyEl=document.getElementById('empty'),
    emptyMsg=document.getElementById('emptymsg'),
    toastEl=document.getElementById('toast'),
    backdrop=document.getElementById('backdrop'),
    panel=document.getElementById('panel'),
    pbody=document.getElementById('pbody'),
    dpno=document.getElementById('dpno'),
    dclass=document.getElementById('dclass'),
    clearx=document.getElementById('clearx');

allDecades.forEach(function(d){
  var o=document.createElement('option');o.value=d;o.textContent=d;decEl.appendChild(o);
});
CLASSES.forEach(function(c){
  var o=document.createElement('option');o.value=c;o.textContent=c;klEl.appendChild(o);
});

var order = DATA.map(function(_,i){return i;});

/* ---------- fake semantic matching ---------- */
var SYN = {
  seat:"chair", stool:"chair", sit:"chair", sitting:"chair",
  handle:"grip", hold:"grip", holder:"grip",
  bike:"bicycle", cycle:"bicycle",
  thermos:"flask", bottle:"flask",
  lighting:"lamp", light:"lamp",
  phone:"telephone",
  board:"skateboard",
  clock:"timer",
  bread:"toaster", toast:"toaster"
};
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ").trim();}
function tokens(s){
  var t=norm(s).split(" ").filter(Boolean);
  var out=[];
  t.forEach(function(w){
    if(w.length>3 && w.slice(-1)==="s") w=w.slice(0,-1);
    out.push(w);
    if(SYN[w]) out.push(SYN[w]);
  });
  return out;
}
function score(item,toks){
  if(!toks.length) return 1;
  var hay=norm(item.t+" "+item.kw+" "+item.c+" "+item.no+" "+item.yr+" "+item.inv+" "+item.asg+" "+item.d);
  var words=hay.split(" ");
  var s=0;
  for(var i=0;i<toks.length;i++){
    var tk=toks[i],hit=0;
    for(var j=0;j<words.length;j++){
      var w=words[j];
      if(w===tk){hit=3;break;}
      if(w.indexOf(tk)===0 && tk.length>2){hit=Math.max(hit,2);}
      else if(tk.length>3 && w.indexOf(tk)>-1){hit=Math.max(hit,1);}
    }
    if(hit===0) return 0;           // every term must land somewhere
    s+=hit;
    if(norm(item.t).indexOf(tk)>-1) s+=2;
  }
  return s;
}
function decadeOf(y){return (Math.floor(y/10)*10)+"s";}

function current(){
  var toks=tokens(qEl.value);
  var dec=decEl.value, kl=klEl.value;
  var rows=[];
  order.forEach(function(idx){
    var it=DATA[idx];
    if(dec && decadeOf(it.yr)!==dec) return;
    if(kl && it.c!==kl) return;
    var sc=score(it,toks);
    if(sc<=0) return;
    rows.push({i:idx,s:sc});
  });
  if(toks.length) rows.sort(function(a,b){return b.s-a.s;});
  return rows;
}

function cardHTML(it,idx){
  return '<button class="card" type="button" data-i="'+idx+'" aria-label="'+it.t+', patent '+it.no+'">'+
    '<span class="art">'+it.f[0]+'</span>'+
    '<span class="meta">'+
      '<span class="pno mono">'+it.no+' &middot; '+it.yr+'</span>'+
      '<span class="ptitle" style="display:block">'+it.t+'</span>'+
      '<span class="pclass" style="display:block">'+it.c+' &middot; '+it.f.length+' figs</span>'+
    '</span></button>';
}

function render(animKind){
  var rows=current();
  var html="";
  rows.forEach(function(r,n){
    html+=cardHTML(DATA[r.i],r.i);
  });
  grid.innerHTML=html;
  // stagger
  var cards=grid.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    cards[i].style.animationDelay=Math.min(i*22,320)+'ms';
  }
  if(animKind==='shuffle'){
    grid.classList.add('shuffling');
    setTimeout(function(){grid.classList.remove('shuffling');},420);
  }
  countEl.textContent=rows.length+' of '+DATA.length+' figures';
  emptyEl.hidden=rows.length>0;
  if(!rows.length){
    var q=qEl.value.trim();
    emptyMsg.textContent = q ? 'Nothing on the wall matches “'+q.slice(0,40)+'”. Try a plainer noun — chair, grip, lamp.'
                             : 'No figures in that decade and class combination.';
  }
  clearx.classList.toggle('on', qEl.value.length>0);
}

/* ---------- toast ---------- */
var toastT=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('on');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){toastEl.classList.remove('on');},1800);
}

/* ---------- detail panel ---------- */
var lastFocus=null, openIdx=null;
function openPanel(idx){
  var it=DATA[idx];
  if(!it) return;
  openIdx=idx;
  lastFocus=document.activeElement;
  dpno.textContent=it.no;
  dclass.textContent=it.c+' · US Design Patent';
  var figs='';
  it.f.forEach(function(svg,i){
    figs+='<div class="fig">'+svg+'<div class="figcap mono">Fig. '+(i+1)+'</div></div>';
  });
  pbody.innerHTML=
    '<h1 class="dt" id="dtitle">'+it.t+'</h1>'+
    '<div class="dsub mono">Issued '+it.yr+' &middot; '+decadeOf(it.yr)+'</div>'+
    '<p class="dplain">'+it.d+'</p>'+
    '<div class="figs">'+figs+'</div>'+
    '<dl class="facts">'+
      '<div class="fact"><dt>Inventor</dt><dd>'+it.inv+'</dd></div>'+
      '<div class="fact"><dt>Assignee</dt><dd>'+it.asg+'</dd></div>'+
      '<div class="fact"><dt>Patent no.</dt><dd class="mono">'+it.no+'</dd></div>'+
      '<div class="fact"><dt>Class</dt><dd>'+it.c+'</dd></div>'+
      '<div class="fact"><dt>Figures</dt><dd>'+it.f.length+' sheets</dd></div>'+
    '</dl>'+
    '<div class="actions">'+
      '<button class="btn dark" type="button" id="copyimg">Copy reference image</button>'+
      '<a class="btn" href="#" id="gpat">View on Google Patents &nearr;</a>'+
    '</div>';
  backdrop.classList.add('on');
  panel.classList.add('on');
  document.body.style.overflow='hidden';
  panel.scrollTop=0;
  setTimeout(function(){panel.focus();},40);
}
function closePanel(){
  backdrop.classList.remove('on');
  panel.classList.remove('on');
  document.body.style.overflow='';
  openIdx=null;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- events ---------- */
grid.addEventListener('click',function(e){
  var c=e.target.closest('.card');
  if(!c) return;
  openPanel(parseInt(c.getAttribute('data-i'),10));
});
pbody.addEventListener('click',function(e){
  if(e.target.id==='copyimg'){
    copyText('figures://ref/'+(openIdx!=null?DATA[openIdx].no:'')+'.svg');
    toast('Copied');
  }
  if(e.target.id==='gpat'){ e.preventDefault(); toast('Demo link — Google Patents disabled'); }
});
document.getElementById('pclose').addEventListener('click',closePanel);
backdrop.addEventListener('click',closePanel);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(panel.classList.contains('on')) closePanel(); }
});

var typeT=null;
qEl.addEventListener('input',function(){
  if(typeT) clearTimeout(typeT);
  typeT=setTimeout(function(){render();},70);
});
qEl.addEventListener('search',function(){render();});
clearx.addEventListener('click',function(){qEl.value='';render();qEl.focus();});
decEl.addEventListener('change',function(){render();});
klEl.addEventListener('change',function(){render();});

document.getElementById('shuffle').addEventListener('click',function(){
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=order[i];order[i]=order[j];order[j]=t;
  }
  render('shuffle');
});

function copyText(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});
    } else { fallbackCopy(txt); }
  }catch(err){ fallbackCopy(txt); }
}
function fallbackCopy(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.top='-1000px';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ /* clipboard unavailable in this context */ }
}

document.getElementById('share').addEventListener('click',function(){
  var p=[];
  if(qEl.value.trim()) p.push('q='+encodeURIComponent(qEl.value.trim()));
  if(decEl.value) p.push('decade='+decEl.value);
  if(klEl.value) p.push('class='+klEl.value.toLowerCase());
  var url='https://figures.wall/w/'+(p.length?('?'+p.join('&')):'all');
  copyText(url);
  toast('Wall link copied');
});

document.getElementById('reset').addEventListener('click',function(){
  qEl.value='';decEl.value='';klEl.value='';render();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* suggestion chips */
var SUGG=['folding chair','camera grip','toaster','bicycle','something to sit on'];
var chips=document.getElementById('chips');
SUGG.forEach(function(s){
  var b=document.createElement('button');
  b.className='chip';b.type='button';b.textContent=s;
  b.addEventListener('click',function(){qEl.value=s;render();});
  chips.appendChild(b);
});

render();
})();
